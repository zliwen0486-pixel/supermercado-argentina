<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.webmanifest"><title>Supermercado Argentina</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f5f7;color:#17202a}header{background:#0f766e;color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5}.wrap{max-width:1050px;margin:auto;padding:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.card{background:#fff;border-radius:14px;padding:15px;margin:12px 0;box-shadow:0 2px 10px #0001}input,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #cbd5db;width:100%}button{background:#0f766e;color:#fff;border:0;cursor:pointer}button.secondary{background:#475569}button.danger{background:#b91c1c}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{width:auto}.muted{color:#667}.hidden{display:none!important}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tabs button{background:#e2e8f0;color:#17202a}.tabs button.active{background:#0f766e;color:#fff}.stat{font-size:22px;font-weight:700}.item{border-top:1px solid #e5e7eb;padding:12px 0}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e2e8f0;font-size:12px}.warn{background:#fef3c7}.ok{background:#dcfce7}.dangerText{color:#b91c1c}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbox{background:#fff;border-radius:16px;padding:16px;width:min(520px,100%)}video{width:100%;border-radius:12px;background:#111;max-height:55vh}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #e5e7eb;font-size:14px}.small{font-size:12px}
</style></head><body><header><div class="wrap row"><strong id="brand">超市商品管理</strong><div class="actions"><button id="lang" class="secondary" style="width:auto">Español</button><button id="logout" class="secondary" style="width:auto">退出</button></div></div></header><main class="wrap"><section id="login" class="card"><h2 id="loginTitle">登录</h2><div class="grid"><input id="user" placeholder="用户名" autocomplete="username"><input id="pass" type="password" placeholder="密码" autocomplete="current-password"></div><button id="loginBtn" style="margin-top:10px">登录</button><p class="muted small">默认管理员：admin / 123456</p><p id="loginMsg" class="dangerText"></p></section><section id="app" class="hidden"><div class="tabs"><button data-tab="dash">📊 仪表盘</button><button data-tab="products">📦 商品</button><button data-tab="moves">📥📤 库存</button><button data-tab="tools">⚙️ 工具</button></div>
<div id="dash" class="tab card"><h2>经营仪表盘</h2><div class="grid"><div class="card"><div class="muted">商品数</div><div id="sProducts" class="stat">0</div></div><div class="card"><div class="muted">库存总量</div><div id="sStock" class="stat">0</div></div><div class="card"><div class="muted">库存预警</div><div id="sWarn" class="stat">0</div></div><div class="card"><div class="muted">库存金额</div><div id="sValue" class="stat">ARS 0</div></div></div></div>
<div id="products" class="tab hidden"><div class="card"><div class="row"><h2>商品资料</h2><div class="actions"><button id="scanBtn">📷 扫描条码</button><button id="photoBtn" class="secondary">🖼️ 从照片读取</button></div></div><div class="grid"><input id="pname" placeholder="商品名称"><input id="pbrand" placeholder="品牌"><input id="psize" placeholder="规格"><input id="pbarcode" placeholder="条码"><input id="pprice" type="number" step="0.01" placeholder="售价 ARS"><input id="pcost" type="number" step="0.01" placeholder="成本 ARS"><input id="pstock" type="number" step="1" placeholder="库存"><input id="pmin" type="number" step="1" placeholder="安全库存"><input id="psupplier" placeholder="供应商"><input id="pcat" placeholder="分类"></div><div class="actions" style="margin-top:10px"><button id="saveP">保存商品</button><button id="clearP" class="secondary">清空</button></div><p id="scanMsg" class="muted"></p><input id="photoInput" type="file" accept="image/*" capture="environment" class="hidden"></div><div class="card"><div class="row"><h2>商品列表</h2><input id="search" placeholder="搜索名称/条码/品牌" style="max-width:300px"></div><div id="plist"></div></div></div>
<div id="moves" class="tab hidden"><div class="card"><h2>库存操作</h2><div class="grid"><select id="moveType"><option value="in">入库</option><option value="out">出库</option><option value="sale">销售</option></select><input id="moveBarcode" placeholder="条码"><input id="moveQty" type="number" min="1" value="1" placeholder="数量"></div><div class="actions" style="margin-top:10px"><button id="moveScan">📷 扫描条码</button><button id="doMove">确认操作</button></div><p id="moveMsg" class="muted"></p></div><div class="card"><h2>最近库存记录</h2><div id="movesList"></div></div></div>
<div id="tools" class="tab hidden"><div class="card"><h2>导入 / 导出</h2><p class="muted">支持 CSV 商品批量导入；导入前请先检查字段。</p><div class="actions"><button id="importBtn">📥 导入 CSV</button><button id="exportBtn">📤 导出 CSV</button><button id="backupBtn">💾 备份数据库</button><button id="restoreBtn" class="secondary">♻️ 恢复数据库</button></div><input id="importInput" type="file" accept=".csv,text/csv" class="hidden"><input id="restoreInput" type="file" accept=".json,application/json" class="hidden"><p id="toolMsg" class="muted"></p></div><div class="card"><h2>使用说明</h2><ul><li>手机实时摄像头扫描通常需要 HTTPS；如果本地打开 HTML 无法调用摄像头，可使用“从照片读取”。</li><li>数据保存在本设备浏览器的 IndexedDB 中，请定期备份。</li><li>原来的收银系统不受影响。</li></ul></div></div></section></main>
<div id="scanner" class="modal hidden"><div class="modalbox"><div class="row"><h2>📷 条码扫描</h2><button id="closeScan" class="danger" style="width:auto">关闭</button></div><video id="video" playsinline></video><p id="camMsg" class="muted"></p><div class="actions"><button id="switchCam" class="secondary">🔄 切换摄像头</button><button id="manualClose" class="secondary">手动输入</button></div></div></div>
<script>
const DB='supermercado_local_v2';let db,stream=null,detector=null,scanTarget='product',facing='environment',lang=localStorage.getItem('sm_lang')||'zh';const $=id=>document.getElementById(id);const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('products')){const s=d.createObjectStore('products',{keyPath:'id',autoIncrement:true});s.createIndex('barcode','barcode',{unique:false})}if(!d.objectStoreNames.contains('moves'))d.createObjectStore('moves',{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>{db=r.result;res(db)};r.onerror=()=>rej(r.error)});const req=(store,mode,fn)=>new Promise(async(res,rej)=>{await openDB();const t=db.transaction(store,mode),s=t.objectStore(store);let r;try{r=fn(s)}catch(e){rej(e);return}t.oncomplete=()=>res(r);t.onerror=()=>rej(t.error)});const all=st=>new Promise(async(res,rej)=>{await openDB();const r=db.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function products(){return all('products')}async function render(){const ps=await products(),q=$('search').value.trim().toLowerCase();const f=ps.filter(p=>!q||[p.name,p.brand,p.barcode,p.supplier].some(x=>String(x||'').toLowerCase().includes(q)));$('plist').innerHTML=f.length?f.map(p=>`<div class="item"><div class="row"><div><b>${esc(p.name||'未命名')}</b> <span class="pill">${esc(p.brand||'')}</span><div class="small muted">${esc(p.barcode||'-')} · ${esc(p.size||'')} · ${esc(p.cat||'')}</div></div><div style="text-align:right"><b>ARS ${Number(p.price||0).toFixed(2)}</b><div class="${Number(p.stock||0)<=Number(p.min||0)?'dangerText':''}">库存 ${p.stock||0}</div></div></div></div>`).join(''):'<p class="muted">暂无商品</p>';let stock=ps.reduce((a,p)=>a+Number(p.stock||0),0),warn=ps.filter(p=>Number(p.stock||0)<=Number(p.min||0)).length,val=ps.reduce((a,p)=>a+Number(p.stock||0)*Number(p.cost||0),0);$('sProducts').textContent=ps.length;$('sStock').textContent=stock;$('sWarn').textContent=warn;$('sValue').textContent='ARS '+val.toFixed(2);renderMoves()}
async function renderMoves(){const m=(await all('moves')).slice(-30).reverse();$('movesList').innerHTML=m.length?m.map(x=>`<div class="item"><b>${x.type==='in'?'入库':x.type==='out'?'出库':'销售'}</b> · ${esc(x.barcode)} · ${x.qty} 件 <span class="muted small">${new Date(x.at).toLocaleString()}</span></div>`).join(''):'<p class="muted">暂无记录</p>'}
function clearP(){['pname','pbrand','psize','pbarcode','pprice','pcost','pstock','pmin','psupplier','pcat'].forEach(i=>$(i).value='')}$('clearP').onclick=clearP;
$('saveP').onclick=async()=>{if(!$('pname').value.trim()||!$('pbarcode').value.trim()){alert(lang==='zh'?'请至少填写商品名称和条码':'Completa nombre y código de barras');return}await req('products','readwrite',s=>s.add({name:$('pname').value.trim(),brand:$('pbrand').value.trim(),size:$('psize').value.trim(),barcode:$('pbarcode').value.trim(),price:Number($('pprice').value||0),cost:Number($('pcost').value||0),stock:Number($('pstock').value||0),min:Number($('pmin').value||0),supplier:$('psupplier').value.trim(),cat:$('pcat').value.trim(),updated:new Date().toISOString()}));$('scanMsg').textContent=lang==='zh'?'已保存':'Guardado';clearP();render()};$('search').oninput=render;
async function startScanner(target){scanTarget=target;$('scanner').classList.remove('hidden');$('camMsg').textContent='';if(!navigator.mediaDevices?.getUserMedia){$('camMsg').textContent='当前环境不能直接调用摄像头，请使用“从照片读取”或手动输入。';return}if(!('BarcodeDetector'in window)){ $('camMsg').textContent='浏览器不支持实时条码识别。可使用照片读取或手动输入。';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{exact:facing}},audio:false});$('video').srcObject=stream;await $('video').play();detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});scan();}catch(e){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});$('video').srcObject=stream;await $('video').play();detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']});scan()}catch(err){$('camMsg').textContent='无法打开摄像头：'+err.message}}}
async function scan(){if(!stream)return;try{const b=await detector.detect($('video'));if(b[0]){const code=b[0].rawValue;applyCode(code);stopScan();return}}catch(e){}requestAnimationFrame(scan)}function applyCode(code){if(scanTarget==='product'){$('pbarcode').value=code;$('scanMsg').textContent='识别到条码：'+code}else{$('moveBarcode').value=code;$('moveMsg').textContent='识别到条码：'+code}}function stopScan(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('video').srcObject=null;$('scanner').classList.add('hidden')}$('closeScan').onclick=stopScan;$('manualClose').onclick=stopScan;$('switchCam').onclick=()=>{facing=facing==='environment'?'user':'environment';stopScan();startScanner(scanTarget)};$('scanBtn').onclick=()=>startScanner('product');$('moveScan').onclick=()=>startScanner('move');
$('photoBtn').onclick=()=>$('photoInput').click();$('photoInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!('BarcodeDetector'in window)){ $('scanMsg').textContent='当前浏览器不能从照片自动读取条码，请手动输入。';return}try{const bmp=await createImageBitmap(f),d=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf']}),b=await d.detect(bmp);if(b[0])applyCode(b[0].rawValue);else $('scanMsg').textContent='没有识别到条码，请让条码更清晰或手动输入。'}catch(err){$('scanMsg').textContent='照片识别失败：'+err.message}};
$('doMove').onclick=async()=>{const code=$('moveBarcode').value.trim(),qty=Math.max(1,Number($('moveQty').value||1));if(!code){$('moveMsg').textContent='请先输入或扫描条码';return}const ps=await products(),p=ps.find(x=>String(x.barcode)===code);if(!p){$('moveMsg').textContent='找不到该商品，请先建立商品资料';return}let delta=$('moveType').value==='in'?qty:-qty;if(p.stock+delta<0){$('moveMsg').textContent='库存不足';return}await req('products','readwrite',s=>s.put({...p,stock:p.stock+delta,updated:new Date().toISOString()}));await req('moves','readwrite',s=>s.add({type:$('moveType').value,barcode:code,qty,at:new Date().toISOString()}));$('moveMsg').textContent='操作完成；当前库存 '+(p.stock+delta);render()};
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}$('exportBtn').onclick=async()=>{const ps=await products();const h='name,brand,size,barcode,price,cost,stock,min,supplier,cat';const rows=ps.map(p=>[p.name,p.brand,p.size,p.barcode,p.price,p.cost,p.stock,p.min,p.supplier,p.cat].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','));download('productos.csv',new Blob(['\ufeff'+h+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));$('toolMsg').textContent='CSV 已导出'};
$('backupBtn').onclick=async()=>{const data={version:2,products:await products(),moves:await all('moves'),at:new Date().toISOString()};download('supermercado_backup.json',new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));$('toolMsg').textContent='备份已导出'};$('restoreBtn').onclick=()=>$('restoreInput').click();$('restoreInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());for(const p of (d.products||[]))await req('products','readwrite',s=>s.put(p));for(const m of (d.moves||[]))await req('moves','readwrite',s=>s.put(m));$('toolMsg').textContent='恢复完成';render()}catch(err){$('toolMsg').textContent='恢复失败：'+err.message}};
$('importBtn').onclick=()=>$('importInput').click();$('importInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;const text=await f.text();const lines=text.replace(/^\ufeff/,'').split(/\r?\n/).filter(Boolean);if(lines.length<2){$('toolMsg').textContent='CSV 没有数据';return}const parse=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'&&line[i+1]==='"'){cur+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out};const h=parse(lines[0]).map(x=>x.trim().toLowerCase());let n=0;for(const line of lines.slice(1)){const a=parse(line);const p={name:a[h.indexOf('name')]||'',brand:a[h.indexOf('brand')]||'',size:a[h.indexOf('size')]||'',barcode:a[h.indexOf('barcode')]||'',price:Number(a[h.indexOf('price')]||0),cost:Number(a[h.indexOf('cost')]||0),stock:Number(a[h.indexOf('stock')]||0),min:Number(a[h.indexOf('min')]||0),supplier:a[h.indexOf('supplier')]||'',cat:a[h.indexOf('cat')]||'',updated:new Date().toISOString()};if(p.name||p.barcode){await req('products','readwrite',s=>s.add(p));n++}}$('toolMsg').textContent='已导入 '+n+' 个商品';render()};
$('loginBtn').onclick=()=>{if($('user').value==='admin'&&$('pass').value==='123456'){sessionStorage.sm='1';$('login').classList.add('hidden');$('app').classList.remove('hidden');showTab('dash')}else $('loginMsg').textContent='用户名或密码错误'};$('pass').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=()=>{sessionStorage.removeItem('sm');location.reload()};function showTab(id){document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));render()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
function setLang(){const es=lang==='es';document.documentElement.lang=es?'es':'zh-CN';$('brand').textContent=es?'Gestión de supermercado':'超市商品管理';$('lang').textContent=es?'中文':'Español';$('logout').textContent=es?'Salir':'退出';$('loginTitle').textContent=es?'Iniciar sesión':'登录';$('user').placeholder=es?'Usuario':'用户名';$('pass').placeholder=es?'Contraseña':'密码';$('loginBtn').textContent=es?'Entrar':'登录'}$('lang').onclick=()=>{lang=lang==='zh'?'es':'zh';localStorage.sm_lang=lang;setLang()};setLang();openDB().then(()=>{if(sessionStorage.sm==='1'){$('login').classList.add('hidden');$('app').classList.remove('hidden');showTab('dash')}else render()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
