name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "没有找到 Android APP ZIP 文件"
            exit 1
          fi
          echo "找到: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Show project files
        run: |
          find project -maxdepth 4 -type f | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: |
          cat > /tmp/kotlin-fix.gradle <<'EOF'
          allprojects {
          configurations.configureEach {
          resolutionStrategy.eachDependency { details ->
          if (details.requested.group == "org.jetbrains.kotlin" &&
              details.requested.name in ["kotlin-stdlib", "kotlin-stdlib-jdk7", "kotlin-stdlib-jdk8"]) {
           details.useVersion("1.8.22")
           gradle assembleDebug --no-daemon --stacktrace --init-script /tmp/kotlin-fix.gradle
             echo "=== APK FILES ==="
             find . -type f \( -name "*.apk" -o -name "*.aab" \) -print
             echo "=== ALL BUILD DIRECTORIES ==="
            find . -type d -name build -print
           }
           }
           }
           }
           EOF
             
      - name: Find APK
        run: |
          find project -type f -name '*.apk' -print

      - name: Prepare APK
        run: |
          APK=$(find project -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          cp "$APK" project/Supermercado-Argentina.apk
    
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
         name: Supermercado-Argentina-APK
         path: project/Supermercado-Argentina.apk
