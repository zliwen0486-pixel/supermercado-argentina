name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        run: |
          set -e

          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "没有找到 Android APP ZIP 文件"
            exit 1
          fi

          echo "找到 ZIP: $ZIP"

          rm -rf project
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Locate Android project
        run: |
          set -e

          echo "=== 查找 Android 项目 ==="

          ROOT=$(find project -type f \
            \( -name 'gradlew' -o -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -print -quit | xargs -r dirname)

          if [ -z "$ROOT" ]; then
            echo "没有找到 Gradle Android 项目"
            echo "=== 项目文件 ==="
            find project -maxdepth 6 -type f | head -200
            exit 1
          fi

          echo "Android 项目目录: $ROOT"

          echo "ANDROID_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "=== 项目文件 ==="
          find "$ROOT" -maxdepth 3 -type f | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Kotlin compatibility fix
        run: |
          cat > /tmp/kotlin-fix.gradle <<'EOF'
          allprojects {
              configurations.configureEach {
                  resolutionStrategy.eachDependency { details ->
                      if (details.requested.group == "org.jetbrains.kotlin" &&
                          details.requested.name in [
                              "kotlin-stdlib",
                              "kotlin-stdlib-jdk7",
                              "kotlin-stdlib-jdk8"
                          ]) {
                          details.useVersion("1.8.22")
                      }
                  }
              }
          }
          EOF

      - name: Build APK
        working-directory: ${{ env.ANDROID_PROJECT_ROOT }}
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug \
              --no-daemon \
              --stacktrace \
              --init-script /tmp/kotlin-fix.gradle
          else
            gradle assembleDebug \
              --no-daemon \
              --stacktrace \
              --init-script /tmp/kotlin-fix.gradle
          fi

          echo "=== APK FILES ==="
          find . -type f -name '*.apk' -print

      - name: Prepare APK
        run: |
          set -e

          APK=$(find "$ANDROID_PROJECT_ROOT" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "错误：没有生成 APK"
            echo "=== 检查 build 目录 ==="
            find "$ANDROID_PROJECT_ROOT" -type d -name build -print
            exit 1
          fi

          echo "找到 APK: $APK"

          mkdir -p output

          cp "$APK" output/Supermercado-Argentina.apk

          echo "APK 已准备完成:"
          ls -lh output/Supermercado-Argentina.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supermercado-Argentina-APK
          path: output/Supermercado-Argentina.apk
          if-no-files-found: error
