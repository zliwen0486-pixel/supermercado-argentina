name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Android project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "没有找到 Android APP ZIP 文件"
            exit 1
          fi
          echo "找到: $ZIP"
          mkdir -p project
          unzip -o "$ZIP" -d project

      - name: Show project files
        run: |
          find project -maxdepth 4 -type f | head -100

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find project -type f -name '*.apk' -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Supermercado-Argentina-APK
          path: project/**/build/outputs/apk/debug/*.apk
